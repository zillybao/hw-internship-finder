# Description-body keywords (case-insensitive token match).
# A posting is kept only if its description matches at least one of these.
# `aliases` collapse alternate spellings onto a keyword above (file order).
keywords:
  - embedded
  - firmware
  - asic
  - fpga
  - rtl
  - mcu
  - microcontroller
  - verilog
  - system verilog
  - vhdl
  - uvm
  - vlsi
  - cmos
  - integrated circuit
  - risc-v
  - rtos
  - mixed-signal
aliases:
  micro-controller: microcontroller
  micro-controllers: microcontroller
  microcontrollers: microcontroller
  mixed signal: mixed-signal
  freertos: rtos
  zephyr: rtos
  riscv: risc-v
  system verilog: systemverilog
  system-verilog: systemverilog