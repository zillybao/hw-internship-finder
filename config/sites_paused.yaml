# --- Full-board TalentBrew HTML details ---

- company: Arm
  ats: talentbrew
  url: https://careers.arm.com
  query: ""
  # Avoid matching "interconnect" — "intern" is a substring of those titles.
  title_keywords:
    - internship
    - "intern "
    - "intern,"
    - "intern-"
    - "(intern"
    - co-op
    - coop
    - industrial placement
  expected_min: 0
  first_seen_runs: 0
